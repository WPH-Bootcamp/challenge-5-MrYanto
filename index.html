<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="index.js" defer></script>
    <title>To-Do List</title>
  </head>
  <body>
    <h1>Your To-Do List</h1>

    <div id="inputArea">
      <label for="inputTodo">Add your todo: </label>
      <input type="text" id="inputTodo" placeholder="Ex: exercise at 10a.m" />
      <label for="inputPriority">Set your priority level </label>
      <select name="priority" id="inputPriority">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
      <button id="btnAdd">Add Todo</button>
    </div>

    <ul id="todoList"></ul>
  </body>
</html>
